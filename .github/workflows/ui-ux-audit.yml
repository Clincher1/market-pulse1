name: Read-only UI UX audit
on:
  push:
    branches: ['arena/2c9c21a4-market-pulse1']
    paths: ['.github/workflows/ui-ux-audit.yml']
permissions:
  contents: write
concurrency:
  group: ui-ux-audit
  cancel-in-progress: false
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install isolated audit tooling
        run: |
          npm install --prefix .local/feature-browser playwright@1.65.1 @sparticuz/chromium@153.0.0 @axe-core/playwright@4.14.0
          .local/feature-browser/node_modules/.bin/playwright install-deps chromium
      - name: Verify published UI twice consecutively
        env:
          UI_EXPECTED_ENTRY: index-MYoXepLA.js
          UI_PRODUCT_SHA: 9f49eefabf9e7b7fb2cfac667fa5e24bc45405fa
        run: |
          set -euo pipefail
          UI_OUTPUT=docs/audit-evidence/ui-ux-after/pass-1 node scripts/ui-ux-audit.mjs
          UI_OUTPUT=docs/audit-evidence/ui-ux-after/pass-2 node scripts/ui-ux-audit.mjs
      - name: Preserve evidence on this branch
        if: always()
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'arena/2c9c21a4-market-pulse1'
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/audit-evidence/ui-ux-after
          git diff --cached --quiet || git commit -m 'docs: preserve two consecutive published UI verification passes'
          git push origin "HEAD:$GITHUB_REF_NAME"
