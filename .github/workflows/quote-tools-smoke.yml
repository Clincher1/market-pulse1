name: Read-only quote tools smoke
on:
  push:
    branches: ['arena/2c9c21a4-market-pulse1']
    paths: ['scripts/check-quote-tools-live.mjs', '.github/workflows/quote-tools-smoke.yml']
permissions:
  contents: write
concurrency:
  group: quote-tools-smoke
  cancel-in-progress: false
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install isolated browser tooling
        run: |
          npm install --prefix .local/production-browser playwright@1.65.1
          .local/production-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Two read-only live feature rounds
        run: node scripts/check-quote-tools-live.mjs
      - name: Preserve small live evidence on this same branch
        if: always()
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'arena/2c9c21a4-market-pulse1'
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/audit-evidence/quote-tools
          git diff --cached --quiet || git commit -m 'docs: preserve live quote-copy and CSV smoke evidence'
          git push origin "HEAD:$GITHUB_REF_NAME"
