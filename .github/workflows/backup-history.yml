name: Verified encrypted history backup

on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:
  push:
    branches: ['arena/398deb1c-market-pulse1']
    paths: ['.github/workflows/backup-history.yml', 'scripts/history-backup.py', 'scripts/backup-envelope.mjs', 'config/backup-recipient.pem']

permissions:
  contents: read

concurrency:
  group: encrypted-production-history-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      restore:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          # Disposable local test DB only. Never used for production access.
          POSTGRES_PASSWORD: local-restore-only
          POSTGRES_DB: market_pulse_restore
        ports: ['127.0.0.1:5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - name: Require secure source connection (never a skipped success)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::Backup not created: secure database connection is not configured."
            echo "No production backup was created. Restore is not certified." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install matching PostgreSQL client and transport
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          python -m pip install 'psycopg[binary]==3.2.13'
      - name: Consistent read-only dump, isolated data restore, checksums, encryption
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_RESTORE_URL: postgresql://postgres:local-restore-only@127.0.0.1:5432/market_pulse_restore
          BACKUP_OUTPUT: ${{ runner.temp }}/sealed-history
        run: python scripts/history-backup.py
      - name: Store ONLY authenticated ciphertext off the production database
        uses: actions/upload-artifact@v7
        with:
          name: encrypted-history-${{ github.run_id }}
          path: ${{ runner.temp }}/sealed-history/*.mpbackup
          retention-days: 14
          if-no-files-found: error
      - name: Record bounded result
        run: |
          echo "Encrypted public-schema backup created; table data restored and content checksums verified in a disposable local PostgreSQL." >> "$GITHUB_STEP_SUMMARY"
          echo "This does not certify full Supabase/Auth/Storage/cron recovery or a long-term SLA." >> "$GITHUB_STEP_SUMMARY"
      - name: Remove runner files
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/sealed-history"
