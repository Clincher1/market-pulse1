name: Read-only revealed comparison screenshots
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    if: github.repository == 'Clincher1/market-pulse1' && startsWith(github.ref, 'refs/heads/arena/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: |
          npm install --prefix .local/production-browser playwright@1.65.1
          .local/production-browser/node_modules/.bin/playwright install --with-deps chromium
      - run: node scripts/capture-market-comparison.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: market-comparison-captures-${{ github.run_id }}
          path: docs/audit-evidence/visual-comparison/
          if-no-files-found: error
          retention-days: 7
