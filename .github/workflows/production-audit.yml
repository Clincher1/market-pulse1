name: Read-only production acceptance audit

on:
  # Audit-only pushes are made after the pinned release is READY and promoted.
  push:
    branches: ['arena/0b3e4807-market-pulse1']
    paths:
      - 'scripts/production-audit.mjs'
      - '.github/workflows/production-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: read-only-production-acceptance
  cancel-in-progress: false

jobs:
  browser:
    if: github.repository == 'Clincher1/market-pulse1' && github.ref == 'refs/heads/arena/0b3e4807-market-pulse1'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install isolated browser tooling (no application dependency changes)
        run: |
          npm install --prefix .local/production-browser playwright@1.65.1 @axe-core/playwright@4.14.0
          .local/production-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Two live browser rounds and observed health (no selfcheck invocation)
        run: node scripts/production-audit.mjs
      - name: Save compact evidence on this same audit branch
        if: always()
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "arena/0b3e4807-market-pulse1"
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          mkdir -p docs/audit-evidence/full-audit
          cp .local/production-audit/summary.json docs/audit-evidence/full-audit/
          for page in passport memory russia world brief; do
            cp ".local/production-audit/B-360-$page.png" docs/audit-evidence/full-audit/
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/audit-evidence/full-audit
          git commit -m "docs: save current full production audit evidence"
          git push origin "HEAD:$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: production-acceptance-evidence
          path: .local/production-audit/
          retention-days: 7
