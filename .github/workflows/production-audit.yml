name: Read-only production acceptance audit

on:
  push:
    branches: ['arena/398deb1c-market-pulse1']
    paths: ['scripts/*audit.mjs', '.github/workflows/production-audit.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: read-only-production-acceptance
  cancel-in-progress: false

jobs:
  browser:
    if: github.repository == 'Clincher1/market-pulse1' && github.ref == 'refs/heads/arena/398deb1c-market-pulse1'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install isolated browser tooling (no application dependency changes)
        run: |
          npm install --prefix .local/production-browser playwright@1.65.1 @axe-core/playwright@4.14.0 lighthouse@13.6.0
          .local/production-browser/node_modules/.bin/playwright install --with-deps chromium firefox webkit
      - name: Expanded technical audit A (data, three engines, privacy, Lighthouse)
        env:
          TECHNICAL_AUDIT_OUTPUT: .local/production-audit/technical-A
        run: node scripts/technical-audit.mjs
      - name: Expanded technical audit B (same gates, independent measurements)
        if: ${{ !cancelled() }}
        env:
          TECHNICAL_AUDIT_OUTPUT: .local/production-audit/technical-B
        run: node scripts/technical-audit.mjs
      - name: Two live browser rounds and observed health (no selfcheck invocation)
        if: ${{ !cancelled() }}
        run: node scripts/production-audit.mjs
      - name: Read-only HTTP, rights and math audit
        if: always()
        run: node scripts/audit-http.mjs
      - name: Save compact evidence on this same audit branch
        if: always()
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "arena/398deb1c-market-pulse1"
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          mkdir -p docs/audit-evidence/technical-readiness
          for round in A B; do
            if [ -f ".local/production-audit/technical-$round/technical.json" ]; then
              cp ".local/production-audit/technical-$round/technical.json" "docs/audit-evidence/technical-readiness/technical-$round.json"
            fi
          done
          if [ -f ".local/production-audit/technical-B/technical.json" ]; then
            cp .local/production-audit/technical-B/technical.json docs/audit-evidence/technical-readiness/technical.json
          fi
          for file in summary.json http-A.json http-B.json; do
            if [ -f ".local/production-audit/$file" ]; then
              cp ".local/production-audit/$file" docs/audit-evidence/technical-readiness/
            fi
          done
          for page in home passport memory russia world brief gold; do
            if [ -f ".local/production-audit/B-360-$page.png" ]; then
              cp ".local/production-audit/B-360-$page.png" docs/audit-evidence/technical-readiness/
            fi
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/audit-evidence/technical-readiness
          git commit -m "docs: save current full production audit evidence"
          git push origin "HEAD:$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: production-acceptance-evidence
          path: .local/production-audit/
          retention-days: 7
