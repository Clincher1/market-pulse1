name: Read-only production acceptance audit

on:
  # Automatic full technical/source/interaction coverage lives together in
  # facts-links-audit.yml, avoiding concurrent evidence commits on one branch.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: read-only-production-acceptance
  cancel-in-progress: false

jobs:
  browser:
    if: github.repository == 'Clincher1/market-pulse1' && startsWith(github.ref, 'refs/heads/arena/')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install isolated browser tooling (no application dependency changes)
        run: |
          npm install --prefix .local/production-browser playwright@1.65.1 @axe-core/playwright@4.14.0 lighthouse@13.6.0
          .local/production-browser/node_modules/.bin/playwright install --with-deps chromium firefox webkit
      - name: Expanded technical audit A (data, three engines, privacy, Lighthouse)
        env:
          TECHNICAL_AUDIT_OUTPUT: .local/production-audit/technical-A
        run: node scripts/technical-audit.mjs
      - name: Expanded technical audit B (same gates, independent measurements)
        if: ${{ !cancelled() }}
        env:
          TECHNICAL_AUDIT_OUTPUT: .local/production-audit/technical-B
        run: node scripts/technical-audit.mjs
      - name: Two live browser rounds and observed health (no selfcheck invocation)
        if: ${{ !cancelled() }}
        run: node scripts/production-audit.mjs
      - name: Read-only HTTP, rights and math audit
        if: always()
        run: node scripts/audit-http.mjs

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: production-acceptance-evidence
          path: .local/production-audit/
          retention-days: 7
