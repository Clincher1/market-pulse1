name: Read-only production acceptance audit

on:
  # Run only after the pinned release is READY and promoted, never race deployment.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: read-only-production-acceptance
  cancel-in-progress: false

jobs:
  browser:
    if: github.repository == 'Clincher1/market-pulse1' && github.ref == 'refs/heads/arena/12edd106-market-pulse1'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install isolated browser tooling (no application dependency changes)
        run: |
          npm install --prefix .local/production-browser playwright@1.65.1
          .local/production-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Two independent live browser and health rounds (read only)
        run: node scripts/production-audit.mjs
      - name: Save compact evidence on this same audit branch
        if: success()
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "arena/12edd106-market-pulse1"
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          mkdir -p docs/audit-evidence/production-followup
          cp .local/production-audit/summary.json docs/audit-evidence/production-followup/
          for page in passport memory russia world; do
            cp ".local/production-audit/B-360-$page.png" docs/audit-evidence/production-followup/
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/audit-evidence/production-followup
          git commit -m "docs: save two read-only production audit rounds and mobile evidence"
          git push origin "HEAD:$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: production-acceptance-evidence
          path: .local/production-audit/
          retention-days: 7
