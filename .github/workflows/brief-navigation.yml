name: Brief navigation verification
on:
  push:
    branches: ['arena/2c9c21a4-market-pulse1']
    paths: ['.github/workflows/brief-navigation.yml']
permissions:
  contents: write
concurrency:
  group: brief-navigation
  cancel-in-progress: false
jobs:
  navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install isolated browser tools
        run: |
          npm install --prefix .local/feature-browser playwright@1.65.1 @sparticuz/chromium@153.0.0
          .local/feature-browser/node_modules/.bin/playwright install-deps chromium
      - name: Verify pinned Brief link and active state twice on all public pages
        env:
          NAV_ORIGIN: https://market-pulse1-eta.vercel.app
          NAV_EXPECTED_ENTRY: index-B9PQ3_RQ.js
          NAV_OUTPUT: docs/audit-evidence/brief-navigation/published
        run: |
          node --input-type=module <<'JS'
          let ready = false;
          for (let attempt = 0; attempt < 24; attempt++) {
            const response = await fetch(process.env.NAV_ORIGIN, {cache:'no-store', signal:AbortSignal.timeout(15000)});
            if (response.ok && (await response.text()).includes(process.env.NAV_EXPECTED_ENTRY)) { ready = true; break; }
            await new Promise(resolve => setTimeout(resolve, 5000));
          }
          if (!ready) throw new Error('Expected release is not yet published');
          JS
          node scripts/check-brief-navigation.mjs
      - name: Preserve measurements on this branch
        if: always()
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'arena/2c9c21a4-market-pulse1'
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/audit-evidence/brief-navigation/published
          git diff --cached --quiet || git commit -m 'docs: preserve published Brief navigation checks'
          git push origin "HEAD:$GITHUB_REF_NAME"
