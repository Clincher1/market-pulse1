name: Read-only facts and every-link audit
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: facts-links-audit
  cancel-in-progress: false
jobs:
  audit:
    if: github.repository == 'Clincher1/market-pulse1' && startsWith(github.ref, 'refs/heads/arena/')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install isolated browser tooling
        run: |
          npm install --prefix .local/production-browser playwright@1.65.1 @axe-core/playwright@4.14.0 lighthouse@13.6.0
          .local/production-browser/node_modules/.bin/playwright install --with-deps chromium firefox webkit
      - name: Wait for the exact explicitly deployed frontend before starting measurements
        run: node scripts/wait-production-artifact.mjs
      - name: Full technical round A (three engines, privacy and unchanged Lighthouse gates)
        env:
          TECHNICAL_AUDIT_OUTPUT: .local/production-audit/technical-A
        run: node scripts/technical-audit.mjs
      - name: Full technical round B (independent, no retry of valid bad metrics)
        if: ${{ !cancelled() }}
        env:
          TECHNICAL_AUDIT_OUTPUT: .local/production-audit/technical-B
        run: node scripts/technical-audit.mjs
      - name: Original sources and every link, round A
        if: ${{ !cancelled() }}
        env:
          AUDIT_VERIFY_LOCAL_BUILD: '1'
          FACTS_LINKS_OUTPUT: .local/facts-links-audit/A
        run: node scripts/facts-links-check.mjs
      - name: Original sources and every link, independent round B
        if: ${{ !cancelled() }}
        env:
          AUDIT_VERIFY_LOCAL_BUILD: '1'
          FACTS_LINKS_OUTPUT: .local/facts-links-audit/B
        run: node scripts/facts-links-check.mjs
      - name: Two independent live interaction, accessibility, math and rights rounds
        if: ${{ !cancelled() }}
        run: node scripts/production-audit.mjs

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: facts-links-evidence
          path: |
            .local/facts-links-audit/
            .local/production-audit/
          retention-days: 7
