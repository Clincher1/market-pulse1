name: Deploy guarded shadow pipeline

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-shadow:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify required secrets are present
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "Set SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_REF in GitHub Actions secrets first."
            exit 1
          fi

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy guarded V2 shadow writers
        run: |
          supabase functions deploy ingest-news-v2-shadow --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy cluster-news-v2-shadow --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy classify-events-v2-shadow --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy update-prices-v2-shadow --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy evaluate-event-impacts-v2-shadow --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy write-forecasts-v2-shadow --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy evaluate-forecasts-v2-shadow --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy run-shadow-pipeline --project-ref "$SUPABASE_PROJECT_REF"
