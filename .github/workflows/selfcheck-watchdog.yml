name: Selfcheck watchdog

on:
  schedule:
    - cron: '5 6 * * *' # 06:05 UTC
  workflow_dispatch:
    inputs:
      telegram_test:
        description: Send one explicit Telegram delivery test without changing health state
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: selfcheck-watchdog
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Read the latest green selfcheck record
        id: watchdog
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SNAPSHOT_SUPABASE_READ_KEY: ${{ secrets.SNAPSHOT_SUPABASE_READ_KEY }}
        run: node scripts/check-selfcheck-watchdog.mjs

      - name: Notify Telegram if selfcheck is stale or missing
        if: steps.watchdog.outputs.notify == 'true'
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TEXT: ${{ steps.watchdog.outputs.message }}
        run: node scripts/send-telegram.js "$TELEGRAM_TEXT"

      - name: Send explicit Telegram delivery test
        if: github.event_name == 'workflow_dispatch' && inputs.telegram_test
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TEXT: "Тест Telegram от selfcheck watchdog."
        run: |
          node scripts/send-telegram.js "$TELEGRAM_TEXT Время UTC: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
