name: Deploy self-check

# The self-check is the part of the site that proves the rest works, so it
# should reach production on its own the moment it is pushed — not when
# somebody remembers to click a button in a dashboard.
on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/selfcheck/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-selfcheck.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-selfcheck:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify required secrets are present
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "Set SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_REF in GitHub Actions secrets first."
            exit 1
          fi

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy selfcheck
        run: supabase functions deploy selfcheck --project-ref "$SUPABASE_PROJECT_REF"
