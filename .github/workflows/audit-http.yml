name: Read-only HTTP and API audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  http:
    if: github.repository == 'Clincher1/market-pulse1' && github.ref == 'refs/heads/arena/0b3e4807-market-pulse1'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Read public pages, API responses and headers without writes
        run: node scripts/audit-http.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: http-audit-${{ github.run_id }}
          path: docs/audit-evidence/release-20261121/http.json
          if-no-files-found: error
          retention-days: 7
