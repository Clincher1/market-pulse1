name: Read-only HTTP and API audit
on:
  push:
    branches: ['arena/0b3e4807-market-pulse1']
    paths: ['scripts/audit-http.mjs', '.github/workflows/audit-http.yml']
permissions:
  contents: write
jobs:
  http:
    if: github.repository == 'Clincher1/market-pulse1' && github.ref == 'refs/heads/arena/0b3e4807-market-pulse1'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Read public pages, API responses and headers without writes
        run: node scripts/audit-http.mjs
      - name: Save evidence on the same audit branch
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "arena/0b3e4807-market-pulse1"
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/audit-evidence/full-audit/http.json
          git commit -m "docs: save read-only HTTP and public API evidence"
          git push origin "HEAD:$GITHUB_REF_NAME"
