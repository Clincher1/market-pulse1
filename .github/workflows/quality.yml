name: Quality checks

on:
  # Validate feature branches without deploying anything.
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        id: dependencies
        run: npm ci

      # Run every independent check after installation, even when an earlier
      # check fails, so one Actions run reports the full set of blockers.
      - name: Run tests
        if: ${{ always() && steps.dependencies.outcome == 'success' }}
        run: npm test

      - name: Type-check the app
        if: ${{ always() && steps.dependencies.outcome == 'success' }}
        run: npm run typecheck

      - name: Lint the app
        if: ${{ always() && steps.dependencies.outcome == 'success' }}
        run: npm run lint

      - name: Build the app
        if: ${{ always() && steps.dependencies.outcome == 'success' }}
        run: npm run build

      - name: Type-check Supabase Edge Functions
        if: ${{ always() }}
        working-directory: supabase/functions
        run: npx -y deno@2 check */index.ts _shared/*.ts
