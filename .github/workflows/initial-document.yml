name: Initial document verification
on:
  push:
    branches: ['arena/2c9c21a4-market-pulse1']
    paths: ['.github/workflows/initial-document.yml']
permissions:
  contents: write
concurrency:
  group: initial-document-verification
  cancel-in-progress: false
jobs:
  document:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install isolated browser tools
        run: |
          npm install --prefix .local/feature-browser playwright@1.65.1 @sparticuz/chromium@153.0.0
          .local/feature-browser/node_modules/.bin/playwright install-deps chromium
      - name: Wait for the expected initial document release
        env:
          DOCUMENT_ORIGIN: https://market-pulse1-eta.vercel.app
          DOCUMENT_EXPECTED_ENTRY: index-ChzyMUIF.js
        run: |
          node --input-type=module <<'JS'
          let ready = false;
          for (let attempt = 0; attempt < 60; attempt++) {
            const response = await fetch(process.env.DOCUMENT_ORIGIN, {cache:'no-store', signal:AbortSignal.timeout(15000)});
            const html = await response.text();
            if (response.ok && html.includes(process.env.DOCUMENT_EXPECTED_ENTRY) && html.includes('data-initial-document="dashboard"')) { ready = true; break; }
            await new Promise(resolve => setTimeout(resolve, 5000));
          }
          if (!ready) throw new Error('Expected initial document release is not yet published');
          JS
      - name: Check all routes, breakpoints and bootstrap modes twice
        env:
          DOCUMENT_ORIGIN: https://market-pulse1-eta.vercel.app
          DOCUMENT_EXPECTED_ENTRY: index-ChzyMUIF.js
          DOCUMENT_OUTPUT: .local/initial-document-published
        run: node scripts/check-initial-document.mjs
      - name: Check existing header navigation twice
        env:
          NAV_ORIGIN: https://market-pulse1-eta.vercel.app
          NAV_EXPECTED_ENTRY: index-ChzyMUIF.js
          NAV_OUTPUT: .local/initial-document-navigation
        run: node scripts/check-brief-navigation.mjs
      - name: Preserve reports on the active branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p docs/audit-evidence/initial-document/published
          gh run download 44940184431 --name initial-document-verification --dir .local/previous-attempt
          cp .local/previous-attempt/initial-document-published/report.json docs/audit-evidence/initial-document/published/attempt-1.json
          if test -f .local/initial-document-published/report.json; then
            cp .local/initial-document-published/report.json docs/audit-evidence/initial-document/published/report.json
            cp .local/initial-document-published/*.png docs/audit-evidence/initial-document/published/
          fi
          if test -f .local/initial-document-navigation/report.json; then
            cp .local/initial-document-navigation/report.json docs/audit-evidence/initial-document/published/navigation.json
          fi
          test "$GITHUB_REF_NAME" = 'arena/2c9c21a4-market-pulse1'
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/audit-evidence/initial-document/published
          git diff --cached --quiet || git commit -m 'docs: preserve initial document public checks'
          git push origin "HEAD:$GITHUB_REF_NAME"
      - name: Preserve browser measurements
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: initial-document-verification
          path: |
            .local/initial-document-published
            .local/initial-document-navigation
          include-hidden-files: true
          retention-days: 14
