name: Read-only responsive layout smoke
on:
  push:
    branches: ['arena/2c9c21a4-market-pulse1']
    paths: ['.github/workflows/layout-smoke.yml']
permissions:
  contents: write
concurrency:
  group: responsive-layout-smoke
  cancel-in-progress: false
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install isolated browser tooling
        run: |
          npm install --prefix .local/feature-browser playwright@1.65.1 @sparticuz/chromium@153.0.0
          .local/feature-browser/node_modules/.bin/playwright install-deps chromium
      # The full 144-case run is preserved separately. Recheck only pages
      # containing sr-only text/collapsed tables after correcting the scanner;
      # do not repeat unrelated pages or change their product code.
      - name: Recheck visible text, not screen-reader-only or collapsed content
        env:
          LAYOUT_ORIGIN: https://market-pulse1-eta.vercel.app
          LAYOUT_LIVE: '1'
          LAYOUT_EXPECTED_ENTRY: index-D-qzxOnO.js
          LAYOUT_PATHS: /russia,/world
          LAYOUT_OUTPUT: docs/audit-evidence/responsive-layout-followup
        run: node scripts/check-layout-browser.mjs
      - name: Preserve compact evidence on this branch
        if: always()
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'arena/2c9c21a4-market-pulse1'
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/audit-evidence/responsive-layout-followup
          git diff --cached --quiet || git commit -m 'docs: preserve live responsive layout evidence'
          git push origin "HEAD:$GITHUB_REF_NAME"
