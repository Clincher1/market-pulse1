name: Shared container verification
on:
  push:
    branches: ['arena/2c9c21a4-market-pulse1']
    paths: ['.github/workflows/container-alignment.yml']
permissions:
  contents: write
concurrency:
  group: container-alignment
  cancel-in-progress: false
jobs:
  geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install isolated browser tools
        run: |
          npm install --prefix .local/feature-browser playwright@1.65.1 @sparticuz/chromium@153.0.0
          .local/feature-browser/node_modules/.bin/playwright install-deps chromium
      - name: Verify public release container geometry in two consecutive rounds
        env:
          CONTAINER_ORIGIN: https://market-pulse1-eta.vercel.app
          CONTAINER_EXPECTED_ENTRY: index-7TM5e1l2.js
          CONTAINER_WIDTHS: 360,768,1024,1440
          CONTAINER_OUTPUT: docs/audit-evidence/site-container/published
        run: node scripts/check-site-container.mjs
      - name: Preserve measurements on this branch
        if: always()
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'arena/2c9c21a4-market-pulse1'
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/audit-evidence/site-container/published
          git diff --cached --quiet || git commit -m 'docs: preserve published shared-container geometry checks'
          git push origin "HEAD:$GITHUB_REF_NAME"
