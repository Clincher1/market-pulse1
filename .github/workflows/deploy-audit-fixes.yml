name: Deploy audited quote and snapshot fixes

# Explicitly scoped production publication for the owner's active audit branch.
# Deploy actual bundles with the CLI: accepting source metadata is not proof
# that an Edge Function can boot. No snapshots/writers are manually invoked.
on:
  push:
    branches: ['arena/12edd106-market-pulse1']
    paths:
      - 'supabase/functions/update-assets/**'
      - 'supabase/functions/selfcheck/**'
      - 'supabase/functions/snapshot-morning/**'
      - 'supabase/functions/_shared/**'
      - '.github/workflows/deploy-audit-fixes.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audited-edge-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'Clincher1/market-pulse1' && github.ref == 'refs/heads/arena/12edd106-market-pulse1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck && npm run lint && npm run build
      - run: npx -y deno@2 check */index.ts _shared/*.ts
        working-directory: supabase/functions
      - uses: supabase/setup-cli@v1
        with:
          version: 3.1.0
      - name: Publish only the three audited functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test "$SUPABASE_PROJECT_REF" = "hekzplfftannlzwvgwwm"
          supabase functions deploy update-assets selfcheck snapshot-morning --project-ref "$SUPABASE_PROJECT_REF" --yes
