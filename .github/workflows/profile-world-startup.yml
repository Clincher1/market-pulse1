name: Read-only world startup diagnosis (not acceptance)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  profile:
    if: github.repository == 'Clincher1/market-pulse1' && startsWith(github.ref, 'refs/heads/arena/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: |
          npm install --prefix .local/production-browser playwright@1.65.1 lighthouse@13.6.0
          .local/production-browser/node_modules/.bin/playwright install --with-deps chromium
      - run: node scripts/profile-world-startup.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: world-startup-profile-${{ github.run_id }}
          path: docs/audit-evidence/performance-profile/world.json
          if-no-files-found: error
          retention-days: 7
