name: Read-only world startup diagnosis (not acceptance)
on:
  push:
    branches: ['arena/**']
    paths: ['scripts/profile-world-startup.mjs', '.github/workflows/profile-world-startup.yml']
permissions:
  contents: write
jobs:
  profile:
    if: github.repository == 'Clincher1/market-pulse1' && startsWith(github.ref, 'refs/heads/arena/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: |
          npm install --prefix .local/production-browser playwright@1.65.1 lighthouse@13.6.0
          .local/production-browser/node_modules/.bin/playwright install --with-deps chromium
      - run: node scripts/profile-world-startup.mjs
      - name: Save diagnostic evidence, without changing any acceptance verdict
        run: |
          set -euo pipefail
          case "$GITHUB_REF_NAME" in arena/*) ;; *) exit 1 ;; esac
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/audit-evidence/performance-profile/world.json
          git commit -m 'docs: retain world main-thread startup diagnosis'
          git push origin "HEAD:$GITHUB_REF_NAME"
