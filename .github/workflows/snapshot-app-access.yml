name: Snapshot App credential check

on:
  push:
    branches: [arena/83b2304e-market-pulse1]
    paths:
      - '.github/workflows/snapshot-app-access.yml'
  workflow_dispatch:

# No write, administration or workflow-dispatch permission is needed for this check.
# A trusted branch push rechecks configuration after the owner updates App variables.
permissions:
  contents: read

jobs:
  verify-app:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Check repository App configuration without displaying values
        env:
          APP_ID: ${{ vars.SNAPSHOT_APP_ID }}
          APP_KEY: ${{ secrets.SNAPSHOT_APP_PRIVATE_KEY }}
        run: |
          node --input-type=module <<'NODE'
          import { createPrivateKey } from 'node:crypto';
          if (process.env.APP_ID !== '5872216') {
            console.error('::error::SNAPSHOT_APP_ID is missing or does not match the approved App ID.');
            process.exit(1);
          }
          try {
            if (!process.env.APP_KEY) throw new Error();
            createPrivateKey(process.env.APP_KEY);
          } catch {
            console.error('::error::SNAPSHOT_APP_PRIVATE_KEY is missing or is not a parseable private key. Its contents are not logged.');
            process.exit(1);
          }
          console.log('PASS: approved App ID and parseable repository private-key secret are present.');
          NODE
      - name: Obtain a repository-scoped read-only installation token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.SNAPSHOT_APP_ID }}
          private-key: ${{ secrets.SNAPSHOT_APP_PRIVATE_KEY }}
          owner: Clincher1
          repositories: market-pulse1
          permission-contents: read
          # Default post action revokes this token; never skip token revocation.
      - name: Verify installation scope and read snapshot without writes
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          node --input-type=module <<'NODE'
          async function read(path) {
            const response = await fetch(`https://api.github.com${path}`, {
              headers: { Authorization: `Bearer ${process.env.APP_TOKEN}`, Accept: 'application/vnd.github+json' },
              signal: AbortSignal.timeout(20000), redirect: 'error',
            });
            if (!response.ok) throw new Error();
            return response.json();
          }
          try {
            const scope = await read('/installation/repositories?per_page=100');
            if (scope.total_count !== 1 || scope.repositories?.length !== 1
              || scope.repositories[0].full_name !== 'Clincher1/market-pulse1') throw new Error();
            const snapshot = await read('/repos/Clincher1/market-pulse1/contents/data/snapshot.json?ref=main');
            if (snapshot.type !== 'file' || snapshot.path !== 'data/snapshot.json') throw new Error();
            const result = 'PASS: App authentication and installation confirmed; test token accesses only market-pulse1 and reads snapshot.json. No writes or protection changes performed.';
            console.log(result);
            const { appendFile } = await import('node:fs/promises');
            await appendFile(process.env.GITHUB_STEP_SUMMARY, `${result}\n\nThis verifies credentials, not permission to bypass main protection.\n`);
          } catch {
            console.error('::error::App read-only API verification failed. Request headers, token and response bodies are not logged.');
            process.exitCode = 1;
          }
          NODE
