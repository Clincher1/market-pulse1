name: Update static snapshot

on:
  schedule:
    # 03:00 UTC = 06:00 Moscow. GitHub can delay scheduled jobs.
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-static-snapshot-main
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # GITHUB_TOKEN is read-only. Only the final push receives an App write token.
    permissions:
      contents: read
    steps:
      - name: Check out current main without persisted credentials
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
      - name: Record base revision
        run: echo "SNAPSHOT_BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Fetch and atomically validate all three observations
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SNAPSHOT_SUPABASE_READ_KEY: ${{ secrets.SNAPSHOT_SUPABASE_READ_KEY }}
        run: node scripts/update-static-snapshot.mjs
      - name: Install locked dependencies
        run: npm ci
      # All checks remain before commit/push, even though App-authenticated pushes
      # may trigger downstream Actions and the Vercel Git integration.
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: Type-check Supabase Edge Functions
        working-directory: supabase/functions
        run: npx -y deno@2 check */index.ts _shared/*.ts
      - name: Check changed files (snapshot only)
        id: snapshot_changes
        shell: bash
        run: |
          set -euo pipefail
          changed_files="$(git diff --name-only)"
          staged_files="$(git diff --cached --name-only)"
          untracked_files="$(git ls-files --others --exclude-standard)"
          {
            echo '### Snapshot: changed-file guard'
            echo 'Tracked changes (paths only):'
            printf '%s\n' "${changed_files:-(none)}"
            echo 'Already staged (paths only):'
            printf '%s\n' "${staged_files:-(none)}"
            echo 'Untracked (paths only):'
            printf '%s\n' "${untracked_files:-(none)}"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          if test -n "$staged_files" || test -n "$untracked_files"; then
            echo '::error::Changed-file guard failed: staged or untracked files detected. No commit or push.'
            echo 'FAILED: staged or untracked files detected; no commit or push.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if test -z "$changed_files"; then
            echo 'has_changes=false' >> "$GITHUB_OUTPUT"
            echo 'Snapshot unchanged; commit and push will be skipped.' | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if test "$changed_files" != 'data/snapshot.json'; then
            echo '::error::Changed-file guard failed: only data/snapshot.json may change. No commit or push.'
            echo 'FAILED: unexpected tracked changes; no commit or push.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo 'has_changes=true' >> "$GITHUB_OUTPUT"
          echo 'PASS: only data/snapshot.json changed.' | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Check main is still current
        if: steps.snapshot_changes.outputs.has_changes == 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo '### Snapshot: main revision guard' >> "$GITHUB_STEP_SUMMARY"
          if git fetch origin main > /dev/null 2>&1; then
            echo 'Fetch main succeeded.' | tee -a "$GITHUB_STEP_SUMMARY"
          else
            code=$?
            echo "::error::Fetching main failed (exit $code). No commit or push; remote details withheld."
            echo "FAILED: fetch main (exit $code); no commit or push." >> "$GITHUB_STEP_SUMMARY"
            exit "$code"
          fi
          remote_sha="$(git rev-parse FETCH_HEAD)"
          local_sha="$(git rev-parse HEAD)"
          printf 'Checkout base: %s\nFetched main: %s\nLocal HEAD: %s\n' \
            "$SNAPSHOT_BASE_SHA" "$remote_sha" "$local_sha" | tee -a "$GITHUB_STEP_SUMMARY"
          if test "$remote_sha" != "$SNAPSHOT_BASE_SHA" || test "$local_sha" != "$SNAPSHOT_BASE_SHA"; then
            echo '::error::Main or local HEAD changed during validation. Stopping without commit or push.'
            echo 'FAILED: main or local HEAD moved; no commit or push.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo 'PASS: main and local HEAD still match checkout base.' | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Commit validated snapshot locally
        if: steps.snapshot_changes.outputs.has_changes == 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo '### Snapshot: local commit' >> "$GITHUB_STEP_SUMMARY"
          # Recheck the allowlist immediately before staging; never git add all.
          if test "$(git diff --name-only)" != 'data/snapshot.json' \
            || test -n "$(git diff --cached --name-only)" \
            || test -n "$(git ls-files --others --exclude-standard)"; then
            echo '::error::Pre-commit changed-file guard failed. No commit or push.'
            echo 'FAILED: pre-commit changed-file guard; no commit or push.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          git config user.name 'Clincher1'
          git config user.email '88886535+Clincher1@users.noreply.github.com'
          git add -- data/snapshot.json
          if test "$(git diff --cached --name-only)" != 'data/snapshot.json'; then
            echo '::error::Staged-file guard failed: only data/snapshot.json may be committed.'
            echo 'FAILED: staged-file guard; no commit or push.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if git commit -m 'Refresh validated static market snapshot'; then
            echo "PASS: local snapshot commit $(git rev-parse HEAD). Not yet pushed." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            code=$?
            echo "::error::Local commit failed (exit $code). Push will not run."
            echo "FAILED: local commit (exit $code); no push." >> "$GITHUB_STEP_SUMMARY"
            exit "$code"
          fi

      - name: Check approved snapshot App identity
        if: steps.snapshot_changes.outputs.has_changes == 'true'
        env:
          SNAPSHOT_APP_ID: ${{ vars.SNAPSHOT_APP_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if test "$SNAPSHOT_APP_ID" != '5872216'; then
            echo '::error::SNAPSHOT_APP_ID is missing or does not match the owner-approved App. No push.'
            exit 1
          fi

      - name: Create short-lived snapshot App write token
        if: steps.snapshot_changes.outputs.has_changes == 'true'
        id: snapshot-app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.SNAPSHOT_APP_ID }}
          private-key: ${{ secrets.SNAPSHOT_APP_PRIVATE_KEY }}
          owner: Clincher1
          repositories: market-pulse1
          permission-contents: write
          skip-token-revoke: 'false'

      - name: Push snapshot commit (approved App, no force)
        if: steps.snapshot_changes.outputs.has_changes == 'true'
        env:
          SNAPSHOT_APP_TOKEN: ${{ steps.snapshot-app-token.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          echo '### Snapshot: push to main using approved App 5872216' >> "$GITHUB_STEP_SUMMARY"
          if test -z "${SNAPSHOT_APP_TOKEN:-}"; then
            echo '::error::Snapshot App token is missing. No push and no fallback to GITHUB_TOKEN.'
            exit 1
          fi
          # Supply auth only to the git push process, not a URL, file or global config.
          auth="$(printf 'x-access-token:%s' "$SNAPSHOT_APP_TOKEN" | base64 -w0)"
          # Never print credentials, remote URLs, git config, environment or raw
          # remote output. Classify known refusals without revealing token data.
          push_log="$(mktemp "$RUNNER_TEMP/snapshot-push.XXXXXX")"
          trap 'rm -f "$push_log"' EXIT
          if GIT_CONFIG_COUNT=1 \
            GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" \
            git push origin HEAD:main > "$push_log" 2>&1; then
            echo "PASS: snapshot commit $(git rev-parse HEAD) pushed to main." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            code=$?
            if grep -Eiq 'GH006|GH013|protected branch|repository rule|rule violations|required status check|pull request' "$push_log"; then
              reason='Branch protection or repository rules rejected the approved App push. Check App identity and owner-configured exception; no fallback, rule changes or retry.'
            elif grep -Eiq 'non-fast-forward|fetch first|stale info|cannot lock ref|failed to update ref' "$push_log"; then
              reason='Main changed after the revision check. No retry, rebase or force push.'
            elif grep -Eiq '403|permission|denied|authentication|not permitted|write access' "$push_log"; then
              reason='App push authentication/permission rejected. Check installation contents: write and repository scope; no fallback to GITHUB_TOKEN.'
            else
              reason='Unclassified push failure. Raw remote output withheld to protect credentials; review GitHub policy/network availability before changing anything.'
            fi
            echo "::error::Push failed (exit $code). $reason"
            echo "FAILED: push (exit $code). $reason" >> "$GITHUB_STEP_SUMMARY"
            exit "$code"
          fi
