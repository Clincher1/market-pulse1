name: Update static snapshot

on:
  schedule:
    - cron: '*/30 * * * *'  # Every 30 minutes; refreshed after observed schedule delays (2026-11-27)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-static-snapshot-main
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # GITHUB_TOKEN is read-only. Only the final push receives an App write token.
    permissions:
      contents: read
    steps:
      - name: Check out current main without persisted credentials
        id: checkout
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
      - name: Record base revision
        id: record_base
        run: echo "SNAPSHOT_BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v7
        id: setup_node
        with:
          node-version: 22
          cache: npm
      - name: Fetch and atomically validate snapshot plus daily history
        id: fetch_snapshot
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SNAPSHOT_SUPABASE_READ_KEY: ${{ secrets.SNAPSHOT_SUPABASE_READ_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_OWNER_CHAT_ID: ${{ secrets.TG_OWNER_CHAT_ID }}
        run: node scripts/run-static-snapshot.mjs
      - name: Generate static market SVG charts
        id: generate_charts
        run: node scripts/build-static-market-charts.mjs
      - name: Install locked dependencies
        id: install_dependencies
        run: npm ci
      # All checks remain before commit/push, even though App-authenticated pushes
      # may trigger downstream Actions and the Vercel Git integration.
      - name: Test repository
        id: test_repository
        shell: bash
        run: |
          set -uo pipefail
          log_file="$RUNNER_TEMP/npm-test.log"
          set +e
          npm test 2>&1 | tee "$log_file"
          test_status=${PIPESTATUS[0]}
          set -e
          failed_tests="$(grep -E '^not ok [0-9]+ - ' "$log_file" | sed -E 's/^not ok [0-9]+ - //' | paste -sd '; ' - || true)"
          if [[ -z "$failed_tests" && "$test_status" -ne 0 ]]; then
            failed_tests='No TAP test names captured; inspect the run log.'
          fi
          if [[ -n "$failed_tests" ]]; then
            echo '### Failed repository tests' >> "$GITHUB_STEP_SUMMARY"
            while IFS= read -r test_name; do printf -- '- %s\n' "${test_name# }"; done < <(printf '%s\n' "$failed_tests" | tr ';' '\n') >> "$GITHUB_STEP_SUMMARY"
          else
            echo '### Repository tests' >> "$GITHUB_STEP_SUMMARY"
            echo 'All tests passed.' >> "$GITHUB_STEP_SUMMARY"
            failed_tests='none'
          fi
          printf 'failed_tests=%s\n' "$failed_tests" >> "$GITHUB_OUTPUT"
          exit "$test_status"
      - name: Type-check application
        id: typecheck_app
        run: npm run typecheck
      - name: Lint repository
        id: lint_repository
        run: npm run lint
      - name: Build application
        id: build_app
        run: npm run build
      - name: Type-check Supabase Edge Functions
        id: typecheck_functions
        working-directory: supabase/functions
        run: npx -y deno@2 check */index.ts _shared/*.ts
      - name: Check changed files (snapshot and generated charts only)
        id: snapshot_changes
        shell: bash
        run: |
          set -euo pipefail
          changed_files="$(git diff --name-only | LC_ALL=C sort)"
          staged_files="$(git diff --cached --name-only)"
          untracked_files="$(git ls-files --others --exclude-standard)"
          {
            echo '### Snapshot: changed-file guard'
            echo 'Tracked changes (paths only):'
            printf '%s\n' "${changed_files:-(none)}"
            echo 'Already staged (paths only):'
            printf '%s\n' "${staged_files:-(none)}"
            echo 'Untracked (paths only):'
            printf '%s\n' "${untracked_files:-(none)}"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          if test -n "$staged_files" || test -n "$untracked_files"; then
            echo '::error::Changed-file guard failed: staged or untracked files detected. No commit or push.'
            echo 'FAILED: staged or untracked files detected; no commit or push.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if test -z "$changed_files"; then
            echo 'has_changes=false' >> "$GITHUB_OUTPUT"
            echo 'Snapshot and chart assets unchanged; commit and push will be skipped.' | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          while IFS= read -r path; do
            case "$path" in
              data/snapshot.json|public/snapshot-charts/brent.svg|public/snapshot-charts/sp500.svg|public/snapshot-charts/gold.svg) ;;
              *)
                echo '::error::Changed-file guard failed: unexpected tracked path. No commit or push.'
                echo 'FAILED: unexpected tracked path; no commit or push.' >> "$GITHUB_STEP_SUMMARY"
                exit 1
                ;;
            esac
          done <<< "$changed_files"
          echo 'has_changes=true' >> "$GITHUB_OUTPUT"
          echo 'PASS: only snapshot data and generated chart assets changed.' | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Check main is still current
        id: main_guard
        if: steps.snapshot_changes.outputs.has_changes == 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo '### Snapshot: main revision guard' >> "$GITHUB_STEP_SUMMARY"
          if git fetch origin main > /dev/null 2>&1; then
            echo 'Fetch main succeeded.' | tee -a "$GITHUB_STEP_SUMMARY"
          else
            code=$?
            echo "::error::Fetching main failed (exit $code). No commit or push; remote details withheld."
            echo "FAILED: fetch main (exit $code); no commit or push." >> "$GITHUB_STEP_SUMMARY"
            exit "$code"
          fi
          remote_sha="$(git rev-parse FETCH_HEAD)"
          local_sha="$(git rev-parse HEAD)"
          printf 'Checkout base: %s\nFetched main: %s\nLocal HEAD: %s\n' \
            "$SNAPSHOT_BASE_SHA" "$remote_sha" "$local_sha" | tee -a "$GITHUB_STEP_SUMMARY"
          if test "$remote_sha" != "$SNAPSHOT_BASE_SHA" || test "$local_sha" != "$SNAPSHOT_BASE_SHA"; then
            echo '::error::Main or local HEAD changed during validation. Stopping without commit or push.'
            echo 'FAILED: main or local HEAD moved; no commit or push.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo 'PASS: main and local HEAD still match checkout base.' | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Commit validated snapshot and charts locally
        id: commit_snapshot
        if: steps.snapshot_changes.outputs.has_changes == 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo '### Snapshot: local commit' >> "$GITHUB_STEP_SUMMARY"
          changed_files="$(git diff --name-only | LC_ALL=C sort)"
          # Recheck the narrow output allowlist immediately before staging.
          if test -n "$(git diff --cached --name-only)" \
            || test -n "$(git ls-files --others --exclude-standard)"; then
            echo '::error::Pre-commit changed-file guard failed. No commit or push.'
            echo 'FAILED: pre-commit changed-file guard; no commit or push.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          while IFS= read -r path; do
            case "$path" in
              data/snapshot.json|public/snapshot-charts/brent.svg|public/snapshot-charts/sp500.svg|public/snapshot-charts/gold.svg) ;;
              *)
                echo '::error::Pre-commit changed-file guard failed. No commit or push.'
                echo 'FAILED: unexpected pre-commit path guard; no commit or push.' >> "$GITHUB_STEP_SUMMARY"
                exit 1
                ;;
            esac
          done <<< "$changed_files"
          git config user.name 'Clincher1'
          git config user.email '88886535+Clincher1@users.noreply.github.com'
          git add -A -- data/snapshot.json public/snapshot-charts/brent.svg public/snapshot-charts/sp500.svg public/snapshot-charts/gold.svg
          staged_files="$(git diff --cached --name-only | LC_ALL=C sort)"
          while IFS= read -r path; do
            case "$path" in
              data/snapshot.json|public/snapshot-charts/brent.svg|public/snapshot-charts/sp500.svg|public/snapshot-charts/gold.svg) ;;
              *)
                echo '::error::Staged-file guard failed: unexpected staged path.'
                echo 'FAILED: staged-file guard; no commit or push.' >> "$GITHUB_STEP_SUMMARY"
                exit 1
                ;;
            esac
          done <<< "$staged_files"
          if test -z "$staged_files"; then
            echo '::error::Staged-file guard failed: no allowed generated changes staged.'
            echo 'FAILED: no generated changes staged; no commit or push.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if git commit -m 'Refresh validated static market snapshot and charts'; then
            echo "PASS: local snapshot commit $(git rev-parse HEAD). Not yet pushed." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            code=$?
            echo "::error::Local commit failed (exit $code). Push will not run."
            echo "FAILED: local commit (exit $code); no push." >> "$GITHUB_STEP_SUMMARY"
            exit "$code"
          fi

      - name: Check approved snapshot App identity
        id: app_identity
        if: steps.snapshot_changes.outputs.has_changes == 'true'
        env:
          SNAPSHOT_APP_ID: ${{ vars.SNAPSHOT_APP_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if test "$SNAPSHOT_APP_ID" != '5872216'; then
            echo '::error::SNAPSHOT_APP_ID is missing or does not match the owner-approved App. No push.'
            exit 1
          fi

      - name: Create short-lived snapshot App write token
        if: steps.snapshot_changes.outputs.has_changes == 'true'
        id: snapshot-app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.SNAPSHOT_APP_ID }}
          private-key: ${{ secrets.SNAPSHOT_APP_PRIVATE_KEY }}
          owner: Clincher1
          repositories: market-pulse1
          permission-contents: write
          skip-token-revoke: 'false'

      - name: Push snapshot commit (approved App, no force)
        id: push_snapshot
        if: steps.snapshot_changes.outputs.has_changes == 'true'
        env:
          SNAPSHOT_APP_TOKEN: ${{ steps.snapshot-app-token.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          echo '### Snapshot: push to main using approved App 5872216' >> "$GITHUB_STEP_SUMMARY"
          if test -z "${SNAPSHOT_APP_TOKEN:-}"; then
            echo '::error::Snapshot App token is missing. No push and no fallback to GITHUB_TOKEN.'
            exit 1
          fi
          # Supply auth only to the git push process, not a URL, file or global config.
          auth="$(printf 'x-access-token:%s' "$SNAPSHOT_APP_TOKEN" | base64 -w0)"
          # Never print credentials, remote URLs, git config, environment or raw
          # remote output. Classify known refusals without revealing token data.
          push_log="$(mktemp "$RUNNER_TEMP/snapshot-push.XXXXXX")"
          trap 'rm -f "$push_log"' EXIT
          if GIT_CONFIG_COUNT=1 \
            GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" \
            git push origin HEAD:main > "$push_log" 2>&1; then
            echo "PASS: snapshot commit $(git rev-parse HEAD) pushed to main." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            code=$?
            if grep -Eiq 'GH006|GH013|protected branch|repository rule|rule violations|required status check|pull request' "$push_log"; then
              reason='Branch protection or repository rules rejected the approved App push. Check App identity and owner-configured exception; no fallback, rule changes or retry.'
            elif grep -Eiq 'non-fast-forward|fetch first|stale info|cannot lock ref|failed to update ref' "$push_log"; then
              reason='Main changed after the revision check. No retry, rebase or force push.'
            elif grep -Eiq '403|permission|denied|authentication|not permitted|write access' "$push_log"; then
              reason='App push authentication/permission rejected. Check installation contents: write and repository scope; no fallback to GITHUB_TOKEN.'
            else
              reason='Unclassified push failure. Raw remote output withheld to protect credentials; review GitHub policy/network availability before changing anything.'
            fi
            echo "::error::Push failed (exit $code). $reason"
            echo "FAILED: push (exit $code). $reason" >> "$GITHUB_STEP_SUMMARY"
            exit "$code"
          fi

      - name: Send Better Stack heartbeat after successful refresh
        id: betterstack_heartbeat
        if: success() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        env:
          BETTERSTACK_HEARTBEAT_URL: ${{ secrets.BETTERSTACK_HEARTBEAT_URL }}
        continue-on-error: true
        run: node scripts/send-betterstack-heartbeat.mjs

      - name: Notify Telegram on successful snapshot update
        id: notify_success
        if: success()
        timeout-minutes: 2
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BETTERSTACK_RESULT: ${{ steps.betterstack_heartbeat.outputs.result }}
        shell: bash
        run: |
          timestamp="$(TZ=Europe/Moscow date '+%Y-%m-%d %H:%M MSK')"
          heartbeat_result="${BETTERSTACK_RESULT:-not sent}"
          message="✅ Static snapshot job finished successfully — ${timestamp}. Snapshot validation, tests, type checks and build passed. Better Stack heartbeat: ${heartbeat_result}. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          node scripts/send-telegram.js "$message"

      - name: Notify Telegram if snapshot update failed
        if: failure() && steps.notify_success.outcome != 'failure'
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OUTCOME_CHECKOUT: ${{ steps.checkout.outcome }}
          OUTCOME_BASE: ${{ steps.record_base.outcome }}
          OUTCOME_SETUP_NODE: ${{ steps.setup_node.outcome }}
          OUTCOME_FETCH: ${{ steps.fetch_snapshot.outcome }}
          OUTCOME_CHARTS: ${{ steps.generate_charts.outcome }}
          OUTCOME_INSTALL: ${{ steps.install_dependencies.outcome }}
          OUTCOME_TEST: ${{ steps.test_repository.outcome }}
          TEST_FAILURES: ${{ steps.test_repository.outputs.failed_tests }}
          OUTCOME_TYPECHECK: ${{ steps.typecheck_app.outcome }}
          OUTCOME_LINT: ${{ steps.lint_repository.outcome }}
          OUTCOME_BUILD: ${{ steps.build_app.outcome }}
          OUTCOME_DENO: ${{ steps.typecheck_functions.outcome }}
          OUTCOME_CHANGED_GUARD: ${{ steps.snapshot_changes.outcome }}
          OUTCOME_MAIN_GUARD: ${{ steps.main_guard.outcome }}
          OUTCOME_COMMIT: ${{ steps.commit_snapshot.outcome }}
          OUTCOME_APP_IDENTITY: ${{ steps.app_identity.outcome }}
          OUTCOME_APP_TOKEN: ${{ steps['snapshot-app-token'].outcome }}
          OUTCOME_PUSH: ${{ steps.push_snapshot.outcome }}
        shell: bash
        run: |
          failed=()
          [[ "$OUTCOME_CHECKOUT" == failure ]] && failed+=("checkout")
          [[ "$OUTCOME_BASE" == failure ]] && failed+=("base revision")
          [[ "$OUTCOME_SETUP_NODE" == failure ]] && failed+=("Node setup")
          [[ "$OUTCOME_FETCH" == failure ]] && failed+=("fetch/validate snapshot and daily history")
          [[ "$OUTCOME_CHARTS" == failure ]] && failed+=("generate static SVG charts")
          [[ "$OUTCOME_INSTALL" == failure ]] && failed+=("npm ci")
          [[ "$OUTCOME_TEST" == failure ]] && failed+=("npm test")
          [[ "$OUTCOME_TYPECHECK" == failure ]] && failed+=("typecheck")
          [[ "$OUTCOME_LINT" == failure ]] && failed+=("lint")
          [[ "$OUTCOME_BUILD" == failure ]] && failed+=("build")
          [[ "$OUTCOME_DENO" == failure ]] && failed+=("Deno typecheck")
          [[ "$OUTCOME_CHANGED_GUARD" == failure ]] && failed+=("snapshot changed-file guard")
          [[ "$OUTCOME_MAIN_GUARD" == failure ]] && failed+=("main revision guard")
          [[ "$OUTCOME_COMMIT" == failure ]] && failed+=("local snapshot commit")
          [[ "$OUTCOME_APP_IDENTITY" == failure ]] && failed+=("approved App identity")
          [[ "$OUTCOME_APP_TOKEN" == failure ]] && failed+=("App token creation")
          [[ "$OUTCOME_PUSH" == failure ]] && failed+=("push")
          if ((${#failed[@]} == 0)); then
            failed+=("step failure; inspect this run")
          fi
          error_summary="$(IFS=', '; echo "${failed[*]}")"
          if [[ "$OUTCOME_TEST" == failure && -n "$TEST_FAILURES" && "$TEST_FAILURES" != none ]]; then
            test_detail=" Тесты: ${TEST_FAILURES:0:240}."
          else
            test_detail=''
          fi
          message="Обновление снимка упало. Job: refresh. Шаг: ${error_summary}.${test_detail} Запуск: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          node scripts/send-telegram.js "$message"
