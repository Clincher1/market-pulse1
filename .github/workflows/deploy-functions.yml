name: Verify and deploy

# The site has to survive without constantly being repaired, so nothing reaches
# production until the checks below pass. That is the whole point of this file:
# a fix that does not type-check or does not build simply does not ship.
#
# No connector can read this workflow's logs, so a failure would otherwise be
# invisible until somebody went looking. Instead a red run files an issue in
# Linear by itself — the check reports on itself rather than waiting to be asked.
#
# Secrets are never read from the repository: functions pick them up from
# Supabase at runtime, and Linear's key stays in repository secrets.
on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'vite.config.ts'
      - 'api/**'
      - 'tests/**'
      - 'vercel.json'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch:

permissions:
  contents: read
  # Нужен, чтобы упавший выкат сам оставлял журнал в issue: логи Actions
  # лежат в чужом хранилище, и из закрытой сети их не прочитать.
  issues: write

concurrency:
  group: verify-and-deploy
  cancel-in-progress: false

env:
  LINEAR_TEAM_ID: 6d6e5192-94c3-44e9-9f42-b8869cb37b61

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # The edge functions are Deno, so they were never covered by the
      # repository's TypeScript setup. This is the check that was missing.
      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check every edge function
        working-directory: supabase/functions
        run: deno check */index.ts _shared/*.ts

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Разборщики первоисточников: три реальные ошибки были пойманы именно
      # здесь (блок ZCYC, срок в годах, пустая ячейка как 0 %). Проверки живут
      # в репозитории, чтобы формат ответа не поменялся молча.
      - name: Test market parsers
        run: npm test

      - name: Lint the site
        run: npm run lint

      # npm run build type-checks the app before bundling it, so one step covers both.
      - name: Type-check and build the site
        run: npm run build

      - name: File an issue if the checks fail
        if: failure()
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: .github/report-failure.sh "Проверка перед выкатом не прошла"

  deploy:
    needs: check
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify required secrets are present
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "Set SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_REF in GitHub Actions secrets first."
            exit 1
          fi

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # Журнал пишем в файл: без этого текст ошибки живёт только в логах
      # Actions, а они недоступны ни из закрытой сети, ни через коннектор.
      - name: Deploy all edge functions
        run: |
          set -o pipefail
          supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF" 2>&1 | tee deploy.log

      - name: File an issue if the deploy fails
        if: failure()
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: .github/report-failure.sh "Выкат функций не прошёл"

      # Отчёт с текстом ошибки — в GitHub issue, чтобы причину можно было
      # прочитать не заходя в веб-интерфейс Actions.
      - name: Put the deploy log into an issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          {
            echo "Выкат функций не прошёл."
            # Значения не печатаем: только факт наличия. Секрет, которого нет,
            # и секрет, который есть, дают разные починки.
            echo
            echo "Состояние окружения:"
            echo "- SUPABASE_ACCESS_TOKEN: $([ -n \"$SUPABASE_ACCESS_TOKEN\" ] && echo есть || echo нет)"
            echo "- SUPABASE_PROJECT_REF: $([ -n \"$SUPABASE_PROJECT_REF\" ] && echo есть || echo нет)"
            echo "- supabase CLI: $(command -v supabase >/dev/null && supabase --version 2>&1 | head -1 || echo 'не установлен')"
            echo "- deploy.log: $([ -f deploy.log ] && echo есть || echo 'нет — шаг выката не запускался')"
            echo
            echo '```'
            tail -n 80 deploy.log 2>/dev/null || echo 'журнала нет'
            echo '```'
          } > deploy-body.md
          existing=$(gh issue list --state open --search 'Выкат функций не прошёл in:title' --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file deploy-body.md
          else
            gh issue create --title "Выкат функций не прошёл" --body-file deploy-body.md
          fi
