<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Market Pulse — мировые события, рынки и Россия</title>
  <desc id="desc">Аналитический сайт запоминает события и сигналы, а затем проверяет их реальным движением цен.</desc>
  <defs>
    <radialGradient id="glow-blue" cx="14%" cy="8%" r="55%">
      <stop offset="0" stop-color="#2563EB" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-violet" cx="88%" cy="18%" r="48%">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-green" cx="82%" cy="92%" r="42%">
      <stop offset="0" stop-color="#059669" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#059669" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panel" x1="770" y1="88" x2="1120" y2="462" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#13223C" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#0B1324" stop-opacity="0.96"/>
    </linearGradient>
    <linearGradient id="mark-bg" x1="76" y1="58" x2="178" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#13233F"/>
      <stop offset="0.55" stop-color="#0B1222"/>
      <stop offset="1" stop-color="#07101F"/>
    </linearGradient>
    <linearGradient id="pulse-line" x1="80" y1="120" x2="1120" y2="330" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.42" stop-color="#3B82F6"/>
      <stop offset="0.72" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#FFFFFF" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.36"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="#070B14"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow-blue)"/>
  <rect width="1200" height="630" fill="url(#glow-violet)"/>
  <rect width="1200" height="630" fill="url(#glow-green)"/>
  <rect x="1" y="1" width="1198" height="628" rx="4" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2"/>

  <!-- Brand mark -->
  <g filter="url(#soft-shadow)">
    <rect x="72" y="56" width="112" height="112" rx="30" fill="url(#mark-bg)"/>
    <rect x="73.5" y="57.5" width="109" height="109" rx="28.5" fill="none" stroke="#31527E" stroke-opacity="0.78" stroke-width="2"/>
    <path d="M84 137H172M84 112H172M84 87H172" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="2"/>
    <path d="M82 123H103L114 91L127 143L137 118H152L166 101" fill="none" stroke="url(#pulse-line)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M154 101H166V113" fill="none" stroke="#34D399" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="114" cy="91" r="6" fill="#E0F2FE" stroke="#22D3EE" stroke-width="3"/>
    <circle cx="127" cy="143" r="6" fill="#E0E7FF" stroke="#818CF8" stroke-width="3"/>
  </g>

  <text x="72" y="264" font-family="Inter, Arial, sans-serif" font-size="82" font-weight="850" letter-spacing="-3.2" fill="#F9FAFB">Market Pulse</text>
  <text x="74" y="318" font-family="Inter, Arial, sans-serif" font-size="37" font-weight="700" letter-spacing="-0.7" fill="#DCEAFE">Мировые события → рынки</text>
  <text x="74" y="358" font-family="Inter, Arial, sans-serif" font-size="37" font-weight="700" letter-spacing="-0.7" fill="#DCEAFE">→ Россия</text>
  <text x="74" y="402" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="500" fill="#9CA3AF">Сайт запоминает сигналы и проверяет их</text>
  <text x="74" y="434" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="500" fill="#9CA3AF">реальным движением цен</text>

  <!-- Feature chips -->
  <g font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">
    <rect x="72" y="466" width="166" height="44" rx="22" fill="#0F1D33" stroke="#31527E"/>
    <text x="96" y="495" fill="#BFDBFE">Tension 0–100</text>
    <rect x="254" y="466" width="205" height="44" rx="22" fill="#0F1D33" stroke="#31527E"/>
    <text x="280" y="495" fill="#BFDBFE">Россия и бизнес</text>
    <rect x="475" y="466" width="190" height="44" rx="22" fill="#101E32" stroke="#31527E"/>
    <text x="502" y="495" fill="#C4B5FD">Память рынка</text>
  </g>

  <text x="74" y="578" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="600" letter-spacing="0.2" fill="#64748B">market-pulse1-eta.vercel.app</text>

  <!-- Right analytical panel -->
  <g filter="url(#soft-shadow)">
    <rect x="752" y="78" width="374" height="392" rx="30" fill="url(#panel)" stroke="#31527E" stroke-opacity="0.72" stroke-width="1.6"/>
    <path d="M782 398H1096M782 340H1096M782 282H1096M782 224H1096" stroke="#FFFFFF" stroke-opacity="0.055" stroke-width="1.4"/>
    <path d="M782 382L846 342L886 364L936 260L982 330L1036 246L1094 270" fill="none" stroke="url(#pulse-line)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="846" cy="342" r="7" fill="#E0F2FE" stroke="#22D3EE" stroke-width="3"/>
    <circle cx="936" cy="260" r="7" fill="#E0E7FF" stroke="#818CF8" stroke-width="3"/>
    <circle cx="1036" cy="246" r="7" fill="#D1FAE5" stroke="#34D399" stroke-width="3"/>

    <g font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700">
      <rect x="782" y="112" width="112" height="40" rx="20" fill="#122A4A" stroke="#31527E"/>
      <text x="806" y="138" fill="#BFDBFE">Событие</text>
      <path d="M900 132H930" stroke="#64748B" stroke-width="3" stroke-linecap="round"/>
      <path d="M924 125L932 132L924 139" fill="none" stroke="#64748B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="938" y="112" width="96" height="40" rx="20" fill="#1D2542" stroke="#4C4F7A"/>
      <text x="963" y="138" fill="#DDD6FE">Канал</text>
      <rect x="782" y="414" width="98" height="36" rx="18" fill="#0E2235" stroke="#24536B"/>
      <text x="806" y="438" fill="#A5F3FC">Активы</text>
      <rect x="892" y="414" width="92" height="36" rx="18" fill="#10261F" stroke="#245B4A"/>
      <text x="916" y="438" fill="#A7F3D0">Исход</text>
      <rect x="996" y="414" width="100" height="36" rx="18" fill="#201B33" stroke="#554A78"/>
      <text x="1019" y="438" fill="#DDD6FE">Вывод</text>
    </g>
  </g>

  <text x="752" y="518" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#CBD5E1">Факты отдельно.</text>
  <text x="752" y="546" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#CBD5E1">Гипотезы — с проверкой.</text>
  <text x="752" y="578" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500" fill="#64748B">Без обещаний точности и торговых советов</text>
</svg>
